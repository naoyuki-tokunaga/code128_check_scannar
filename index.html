<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>バーコード照合</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#4CAF50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="バーコード照合">

<style>

body{
    font-family:sans-serif;
    text-align:center;
    padding:20px;
    transition:background-color 0.2s;
}

body.wait{
    background:#f5f5f5;
}

body.ok{
    background:#4CAF50;
}

body.ng{
    background:#E53935;
}

.box{
    background:white;
    border-radius:12px;
    padding:20px;
    margin:15px auto;
    max-width:900px;
}

input{
    width:95%;
    font-size:24px;
    padding:12px;
    text-align:center;
}

#status{
    font-size:28px;
    font-weight:bold;
    margin-bottom:15px;
}

#result{
    font-size:120px;
    font-weight:bold;
    border-radius:12px;
    padding:40px;
    margin-top:20px;
}

.wait{
    background:#ddd;
}

.ok{
    background:#4CAF50;
    color:white;
}

.ng{
    background:#E53935;
    color:white;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #ccc;
    padding:6px;
    font-size:14px;
    word-break:break-all;
}

</style>
</head>

<body class="wait">

<h1>バーコード照合</h1>

<div id="status">
読取①をスキャンしてください
</div>

<div class="box">
<h2>読取①</h2>
<input id="scan1" autocomplete="off" inputmode="none">
</div>

<div class="box">
<h2>読取②</h2>
<input id="scan2" autocomplete="off" inputmode="none">
</div>

<div id="result" class="wait">
読取待ち
</div>

<div class="box">

<h2>履歴</h2>

<div style="overflow-x:auto">

<table id="historyTable">

<tr>
<th>時刻</th>
<th>結果</th>
<th>元①</th>
<th>元②</th>
</tr>

</table>

</div>

</div>

<script>

let historyList=[];

/* ------------------------------
   バーコード整形
------------------------------ */

function normalizeBarcode(code){

    return String(code)
        .replace(/\r/g,"")
        .replace(/\n/g,"")
        .replace(/\t/g,"")
        .trim();
}

function playOK(){

    const ctx =
        new (window.AudioContext ||
        window.webkitAudioContext)();

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.frequency.value = 1200;
    osc.type = "sine";

    osc.connect(gain);
    gain.connect(ctx.destination);

    gain.gain.setValueAtTime(
        0.2,
        ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        ctx.currentTime + 0.15
    );

    osc.start();

    osc.stop(
        ctx.currentTime + 0.15
    );
}

function playNG(){

    const ctx =
        new (window.AudioContext ||
        window.webkitAudioContext)();

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.frequency.value = 250;
    osc.type = "sawtooth";

    osc.connect(gain);
    gain.connect(ctx.destination);

    gain.gain.setValueAtTime(
        0.3,
        ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        ctx.currentTime + 0.5
    );

    osc.start();

    osc.stop(
        ctx.currentTime + 0.5
    );
}

function checkMatch(){

    const scan1 =
        normalizeBarcode(
            document.getElementById("scan1").value
        );

    const scan2 =
        normalizeBarcode(
            document.getElementById("scan2").value
        );

    const result =
        document.getElementById("result");

    const status =
        document.getElementById("status");

    const isMatch =
        scan2.includes(scan1);

    if(isMatch){

        result.innerText="OK";
        result.className="ok";

        document.body.className="ok";

        status.innerText=
        "一致しました";

        playOK();

        addHistory(
            "OK",
            scan1,
            scan2
        );

        setTimeout(
            resetScan,
            500
        );

    }else{

        result.innerText="NG";
        result.className="ng";

        document.body.className="ng";

        status.innerText=
        "不一致です";

        playNG();

        addHistory(
            "NG",
            scan1,
            scan2
        );

        setTimeout(
            resetScan,
            3000
        );
    }
}

function addHistory(
    result,
    scan1,
    scan2
){

    historyList.unshift({

        time:
        new Date()
        .toLocaleTimeString(),

        result,
        scan1,
        scan2

    });

    if(historyList.length > 20){
        historyList.pop();
    }

    renderHistory();
}

function renderHistory(){

    let html=`
    <tr>
        <th>時刻</th>
        <th>結果</th>
        <th>元①</th>
        <th>元②</th>
    </tr>
    `;

    historyList.forEach(item=>{

        const color =
            item.result==="OK"
            ? "#ccffcc"
            : "#ffcccc";

        html += `
        <tr style="background:${color}">
            <td>${item.time}</td>
            <td>${item.result}</td>
            <td>${item.scan1}</td>
            <td>${item.scan2}</td>
        </tr>
        `;
    });

    document.getElementById(
        "historyTable"
    ).innerHTML = html;
}

function resetScan(){

    document.getElementById("scan1").value="";
    document.getElementById("scan2").value="";

    document.getElementById("result").innerText=
    "読取待ち";

    document.getElementById("result").className=
    "wait";

    document.body.className="wait";

    document.getElementById("status").innerText=
    "読取①をスキャンしてください";

    document.getElementById("scan1").focus();
}

window.onload = () => {

    document.getElementById(
        "scan1"
    ).focus();

};

document.getElementById("scan1")
.addEventListener("keydown",function(e){

    if(e.key!=="Enter"){
        return;
    }

    e.preventDefault();

    document.getElementById("status")
    .innerText=
    "読取②をスキャンしてください";

    document.getElementById("scan2")
    .focus();
});

document.getElementById("scan2")
.addEventListener("keydown",function(e){

    if(e.key!=="Enter"){
        return;
    }

    e.preventDefault();

    checkMatch();

});

document.body.addEventListener(
"click",
()=>{

    if(
        document.getElementById("scan1").value===""
    ){
        document.getElementById("scan1")
        .focus();
    }

});

</script>

<script>

if("serviceWorker" in navigator){

    window.addEventListener(
    "load",
    ()=>{

        navigator.serviceWorker
        .register("./service-worker.js")
        .then(()=>{

            console.log(
            "Service Worker登録完了"
            );

        })
        .catch(err=>{

            console.log(
            "Service Workerエラー",
            err
            );
        });
    });
}

</script>

</body>
</html>
